    <script>
      (function () {
        try {
          var savedTheme = window.localStorage.getItem('se-exam-guide-theme-v1');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return desc.get.call(window);
              },
              set: function () {},
            });
          }
        } catch (_) {}
        window.addEventListener(
          'error',
          function (e) {
            if (e && typeof e.filename === 'string' && e.filename.indexOf('chrome-extension://') === 0) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true,
        );
      })();
    </script>
